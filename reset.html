<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password · Ketras Kloset</title><meta name="robots" content="noindex">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FBF1F4;font-family:Inter,Arial,sans-serif;color:#141014;padding:20px;box-sizing:border-box}
.rb{background:#fff;border-radius:18px;padding:34px 28px;max-width:420px;width:100%;box-shadow:0 30px 80px #9e2a5e22}.rb img{height:40px}.rb h1{font:400 30px "Playfair Display",Georgia,serif;margin:16px 0 8px}.rb label{display:block;font-size:12px;font-weight:600;margin:14px 0 6px}.rb input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #0002;border-radius:12px;font:15px inherit}
.rb button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:99px;background:#141014;color:#fff;font:600 15px Inter,sans-serif;cursor:pointer}.sa-msg{font-size:13px;margin-top:12px}.sa-msg.err{color:#b3261e}.sa-msg.ok{color:#1e7b3a}</style></head>
<body><main class="rb"><a href="index.html"><img src="assets/logo/ketras-kloset-logo-header.jpg" alt="Ketras Kloset"></a><h1>Choose a new password</h1>
<form id="rf" hidden><label for="p1">New password</label><input id="p1" name="p1" type="password" minlength="8" required autocomplete="new-password"><label for="p2">Repeat it</label><input id="p2" name="p2" type="password" minlength="8" required autocomplete="new-password"><button>Save password</button></form>
<p class="sa-msg" id="rmsg" aria-live="polite"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/auth-config.js?v=4"></script><script src="js/reset.js?v=4"></script></body></html>
